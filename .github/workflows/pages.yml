name: pages

# Publishes site/ to GitHub Pages: fetches fresh data from the public sources, then
# deploys. Runs when main changes, on a schedule, and by hand. Free on public repos.
# Data is not committed: each run rebuilds it, reusing the last published copy (marked
# stale) for any source that fails.
on:
  push:
    branches: [main]
  schedule:
    - cron: "35 21 * * 1-5"   # after the US close (4:35pm ET in winter) and Treasury's daily rates
    - cron: "10 13 * * *"     # morning: IPO calendar, SEC filings, FRED releases (8:10am ET)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      has_site: ${{ steps.site.outputs.has_site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: site
        run: |
          if [ -f site/index.html ]; then echo has_site=true; else echo has_site=false; fi >> "$GITHUB_OUTPUT"
      - name: Fetch data from public sources
        if: steps.site.outputs.has_site == 'true'
        env:
          PREVIOUS_BASE: https://ideafactory-labs.github.io/ticker-radar/
        run: |
          python3 -m radar.build --out site/data | tee build.txt
          {
            echo '### Data refresh'
            echo '```'
            cut -c1-300 build.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: steps.site.outputs.has_site == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: steps.site.outputs.has_site == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.has_site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # id-token is GitHub Pages' own deployment login — it grants nothing outside Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
